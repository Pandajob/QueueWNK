name: ตรวจโค้ด

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # ยังไม่บังคับผ่าน — มีของค้างเดิมอยู่ 18 จุด (eqeqeq กับ no-await-expression-member)
      # ที่แก้แบบอัตโนมัติไม่ได้ เพราะ `== null` เปลี่ยนเป็น `=== null` แล้วความหมายเปลี่ยน
      # ต้องไล่ดูทีละจุด เอาออกให้บังคับผ่านเมื่อเคลียร์หมดแล้ว
      - name: lint
        run: npm run lint
        continue-on-error: true

      # เทสต์เป็น unit ล้วน ไม่ต่อฐานข้อมูลและไม่ยิงออกเน็ต
      - name: test
        run: npm run test

  # พิสูจน์ว่า image ที่จะแจกยัง build ได้ ก่อนจะไปเจอตอนออกรุ่นจริง
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
